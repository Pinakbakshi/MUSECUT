name: MUSECUT CI
on:
  push:
    branches: [feat/musecut-mvp]
    paths: ["reelforge/**", ".github/workflows/musecut.yml"]
  pull_request:
    paths: ["reelforge/**", ".github/workflows/musecut.yml"]
permissions:
  contents: read
jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reelforge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
  worker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile reelforge/backend/app/main.py
